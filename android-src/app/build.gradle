plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghostmap.poc'
    compileSdk 34

    defaultConfig {
        applicationId "com.ghostmap.poc"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
